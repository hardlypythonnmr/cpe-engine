# naos-motor (C3, 19-nov): solo quedan el despacho, despertar mercury y el cierre automático. Los pasos 2, 2b y 3 de abajo se quitaron.
# Ronda sombra sin modelo (N, 9-nov-2026: "Yes, activate"; NAOS 4.1, 10-nov-2026).
# Cada hora a las :25 hace tres cosas, sin Claude:
#   1. Despacho (paso D de la operadora): `programador.py --marca naos --despachar --sin-lote` (sin agrupar: es el respaldo y debe ser simple) dispara naos-reel.yml con lo aprobado que sale en la próxima
#      ventana. Corre solo si la operadora lleva 2 h o más callada, como antes de la 4.1: la sombra no escribe reservas y así
#      nunca despacha a la vez que ella. N puede prenderlo cada hora con la variable NAOS_SOMBRA_SIEMPRE=on. Lo que lo haría seguro:
#      - programador.py `tocan()` salta toda fila con url_reel o publicado_utc, así que lo ya publicado no se despacha otra vez.
#      - naos-reel.yml tiene `concurrency: naos-reel-<slug>` sin cancelar: dos despachos del mismo slug van en fila, y el segundo
#        arranca con main al día, ve url_reel en publicados.csv (accion_reel.py `datos`, ya=true) y salta todos los pasos.
#      - La compuerta de N sigue en naos-reel.yml y en ig.py (D-301): sin la fila aprobada de ESE video y ese caption no sale nada.
#      Hueco que queda: si la Action publica en Meta y falla al guardar url_reel en main, un segundo despacho podría repetir la pieza.
#      No sube Shorts ni responde comentarios.
#   2. Estado: deja en main `earn/naos/medicion/estado-hoy.md` (línea de `uso_sensor.py estado` y la salida de `estado.py --sin-red`).
#      Las sesiones lo leen con `git show origin/main:earn/naos/medicion/estado-hoy.md` en vez de correr estado.py (más de 2 minutos).
#      Solo hace commit si cambió algo además de la hora. El commit sigue el patrón de naos-reel.yml ("Guardar en main"): cada
#      vuelta parte de origin/main, regenera y reintenta; copia.py guardar de la operadora hace lo mismo y toca otros archivos.
#   2b. Contexto: si DECISIONS.md o HANDOFF.md cambiaron después del último CONTEXTO-HOY.md (fechas por la API), regenera
#      CONTEXTO-HOY.md, decisiones-indice.md y cola/lote.md con contexto_hoy.py, reusando la salida de estado.py. Va en el mismo commit.
#   3. Aviso a Telegram (secretos TELEGRAM_TOKEN y TELEGRAM_CHAT): una vez por día y por motivo si existe medicion/FRENO (sensor de
#      uso) o si la operadora lleva 3 h o más sin commits "operadora: registros". Qué avisó y cuándo queda en medicion/avisos-sombra.json.
# No registra el 👍 por reacción (paso R, `programador.py --aprobaciones`): necesita bajar los videos por LFS de cada issue en cada
#   hora. N usa el comentario "ok" mientras tanto. Tampoco sube Shorts: faltan GOOGLE_OAUTH_* en secretos de Actions.
# Mercury (12-nov): el mismo despacho mira solo las piezas de Mercury y, si hay una en ventana, despierta mercury-publicar.yml.
# Minutos: ~1,5 por corrida x 8 x 30 = ~360 al mes (cada 3 h, D-415). Medir contra https://github.com/settings/billing antes de dejarla fija.
name: naos-ronda-sombra
on:
  workflow_dispatch:
  schedule:
    - cron: "25 */3 * * *"  # N, 10-nov: "Cada 3 horas" (D-415)
permissions:
  contents: write  # el cierre automático (cola/aprobar/*/estado.json) a main
  actions: write   # solo para disparar naos-reel.yml
  issues: write    # solo el cierre automático: comenta "Live" y cierra el issue de lo que ya salió (aprobar.cerrar)
concurrency: { group: naos-ronda-sombra, cancel-in-progress: false }
jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: ¿Hace cuánto no hay commit de la operadora?
        id: latido
        run: |
          ultimo=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=100" --jq '[.[] | select(.commit.message | startswith("operadora: registros"))][0].commit.committer.date' || true)
          horas=$(( ( $(date -u +%s) - $(date -u -d "${ultimo:-1970-01-01}" +%s) ) / 3600 ))
          echo "horas=$horas" >> "$GITHUB_OUTPUT"
          echo "Última ronda de la operadora: ${ultimo:-nunca} ($horas h)"
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Lo que lee programador.py (despacho) y cierre_auto.py. C3 de naos-motor: sin historia, decisiones ni contexto.
          sparse-checkout: |
            /earn/naos/motor/*.py
            /earn/naos/motor/aprobar/
            /earn/naos/motor/instagram/
            /earn/naos/motor/comentarios/
            /earn/naos/motor/youtube/*.py
            /earn/naos/medicion/
            /earn/naos/cola/aprobar/*/estado.json
            /earn/naos/cola/aprobar/*/pieza.json
            /earn/naos/cola/aprobar/_tandas/
      - name: Despachar lo aprobado que sale en la próxima ventana
        # Como antes: solo si la operadora lleva 2 h o más callada. Con la variable NAOS_SOMBRA_SIEMPRE=on (la prende N) corre cada hora.
        if: ${{ steps.latido.outputs.horas >= 2 || vars.NAOS_SOMBRA_SIEMPRE == 'on' }}
        working-directory: earn/naos/motor/aprobar
        # Solo piezas de NAOS, igual que la operadora (ronda.py): las de Mercury las despacha mercury-publicar.yml.
        run: python3 programador.py --marca naos --despachar --sin-lote
      - name: Despertar mercury-publicar si hay una pieza de Mercury en ventana
        # Mercury ya no tiene cron cada 30 minutos (48 corridas al día, ~1.440 min al mes): solo corre cuando alguien la despierta.
        # Misma condición que el despacho de arriba (operadora callada 2 h o más, o NAOS_SOMBRA_SIEMPRE=on). Si nada está en
        # ventana no dispara nada. No sube ni aprueba: la compuerta sigue en mercury-publicar.yml, subir.py e ig.py.
        if: ${{ steps.latido.outputs.horas >= 2 || vars.NAOS_SOMBRA_SIEMPRE == 'on' }}
        working-directory: earn/naos/motor/aprobar
        run: python3 programador.py --disparar-mercury
      - name: Cierre automático de lo que ya salió (D-513, opción A de N, 13-nov)
        # N: "Ronda de cada 3 h". Las piezas con url en publicados.csv y la hora de salida pasada que siguen en "aprobado" o
        # "subiendo" se cierran con la misma función de aprobar.py (comenta y cierra el issue). No cierra lo que sale en el futuro
        # ni lo que tiene el veto de N abierto. Sin nada que cerrar termina en segundos y no toca git ni GitHub. Corre siempre,
        # aunque la operadora esté viva (ella no tiene este paso). Si falla, la corrida sigue con un aviso.
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        working-directory: earn/naos/motor/aprobar
        env:
          GIT_AUTHOR_NAME: naos-cierre
          GIT_AUTHOR_EMAIL: naos-cierre@users.noreply.github.com
          GIT_COMMITTER_NAME: naos-cierre
          GIT_COMMITTER_EMAIL: naos-cierre@users.noreply.github.com
        run: python3 cierre_auto.py --git || echo "::warning::cierre_auto.py falló; no se cerró nada esta ronda (la sombra lo repite en 3 h)"
