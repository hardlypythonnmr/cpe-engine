# Freno por lista de ids del canal de NAOS (23-nov-2026, semana 2026-W48). Solo en la rama ses/freno-naos-w48.
# OJO: este archivo reemplaza SOLO EN ESTA RAMA a naos-fb-prueba.yml (workflow manual, sin cron) porque GitHub solo despacha
# workflows cuyo archivo existe en main. En main sigue el original. Equivale a un dd-bajar-lista-naos.yml.
# Pasa a privado y sin fecha Shorts del canal de NAOS por id de video. Solo llaves GOOGLE_OAUTH_* (las de NAOS); no usa DD_OAUTH_*.
# Comprueba que el token y cada video son del canal de NAOS (y no de DD) antes de tocar. Por defecto en SECO. Sin cron.
#   gh workflow run naos-fb-prueba.yml --ref ses/freno-naos-w48 -R hardlypythonnmr/naos-motor -f ids="ID1 ID2" -f seco=false
name: naos-fb-prueba
run-name: naos-freno-w48 (seco=${{ inputs.seco }})

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "ids de video de YouTube del canal de NAOS separados por espacio (máx. 30)"
        type: string
        required: true
      seco:
        description: "en seco: solo lee y lista, no cambia nada en YouTube"
        type: boolean
        default: true

permissions:
  contents: read

concurrency: { group: naos-freno-w48, cancel-in-progress: false }

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IDS: ${{ inputs.ids }}
      SECO: ${{ inputs.seco }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /earn/naos/motor/*.py
            /earn/naos/motor/youtube/*.py
            /earn/naos/motor/youtube/canales.json
            /earn/naos/motor/investigacion/yt.py
      - name: Bajar por lista (canal NAOS)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -f
          args=($IDS)
          [ "$SECO" = "true" ] || args+=(--si-bajar)
          python3 earn/naos/motor/youtube/bajar_lista_naos.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/salida.txt"
          rc=${PIPESTATUS[0]}
          { echo '```'; cut -c1-300 "$RUNNER_TEMP/salida.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
