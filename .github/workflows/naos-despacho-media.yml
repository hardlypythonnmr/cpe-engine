# Despacho de la media hora (D-516, opción A de N; la mesa la amplió a DD el 14-nov 23:30Z): a las :27 de cada hora despacha lo de
# NAOS y de DD (Mercury) que sale en esa media hora,
# para que las piezas de Instagram de :18 a :39 no salgan 30 a 40 min tarde (hoy solo las ve la ronda de las :57; retraso mediano
# medido: 41 min, empresa/evolucion/2026-11-13-paralelo/rendimiento/retraso-minuto.md).
# Por qué `--antes 12`: la ventana mira solo 12 min hacia adelante (hasta :39). Lo de :40 en adelante sigue en la ronda de las :57,
# y así esta Action no duerme esperando la hora (--tope-espera 12).
# Costo estimado: ~1 min por corrida sin pieza, 24 corridas al día.
# No aprueba nada: la compuerta de N sigue en publicados.csv y en naos-reel (sin la fila aprobada de ese video y ese caption no sale).
# El reclamo reel-claim de naos-reel evita duplicados si la ronda de las :57 despacha la misma pieza. No escribe a main.
# Cron a las :26 y --antes 13 (Rendimiento 5, 15-nov): con "27" GitHub no la corrió ni una vez entre las 00:27 y las 03:27Z
# del 15-nov; cambiar el cron obliga a registrarlo de nuevo. --antes 13 mantiene la ventana hasta :39, como antes.
# G7 (Rendimiento 9, 17-nov; N: "G7: media solo con piezas"): ya no corre las 24 horas, solo en las horas que traen una pieza
#   de :18 a :39, fecha por fecha, para 14 días. Las líneas entre las marcas horas-media las escribe
#   `python3 earn/naos/motor/aprobar/horas_media.py --escribir` (la mesa, al abrir tandas o una vez al día); no se editan a mano.
#   Una tanda nueva a una hora sin cron no pierde su salida: el paso D2 de la operadora (programador.py --tramo lejos) dispara esta
#   Action a las :26 de esa hora (workflow_dispatch). Si el cron vence, la operadora cubre todas las horas con pieza.
name: naos-despacho-media
on:
  workflow_dispatch:
  # schedule: apagado en el arranque de naos-motor (paso 13); se enciende en el paso 16
  # # horas-media: desde
  # - cron: "26 17,18,19,20,22 19 11 *"  # 2026-11-19
  # - cron: "26 0,1,2,3,4,10,12,13,16,17,18,21 20 11 *"  # 2026-11-20
  # - cron: "26 3,4,10,12,13,14,17,18,19,20,21 21 11 *"  # 2026-11-21
  # - cron: "26 2,3,4,9,10,12,13,14,17,18,20,21,22 22 11 *"  # 2026-11-22
  # - cron: "26 1,3,4,6,12,13,14,18,20,21 23 11 *"  # 2026-11-23
  # - cron: "26 1,2,3,4,6,12,13,14,16,18,20,21 24 11 *"  # 2026-11-24
  # - cron: "26 1,4,12,13,14,16,18,21 25 11 *"  # 2026-11-25
  # - cron: "26 1,2,4,13,14,18,19,21 26 11 *"  # 2026-11-26
  # - cron: "26 1,18 27 11 *"  # 2026-11-27
  # - cron: "26 1,4,18 28 11 *"  # 2026-11-28
  # - cron: "26 0,1,4,12,14,18 29 11 *"  # 2026-11-29
  # - cron: "26 1,4,18,21,23 30 11 *"  # 2026-11-30
  # - cron: "26 1,4,15,23 1 12 *"  # 2026-12-01
  # - cron: "26 13,15,17,20,21 2 12 *"  # 2026-12-02
  # - cron: "26 13,15 3 12 *"  # 2026-12-03
  # # horas-media: hasta
permissions:
  contents: read
  actions: write  # solo para disparar naos-reel.yml
concurrency: { group: naos-despacho-media, cancel-in-progress: false }
jobs:
  despacho:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Lo que leen programador.py y registro.py (aprobar.py y separacion_ig.py viven en motor/ y motor/aprobar/).
          sparse-checkout: |
            /earn/naos/motor/*.py
            /earn/naos/motor/aprobar/
            /earn/naos/motor/instagram/
            /earn/naos/motor/investigacion/yt.py
            /earn/naos/medicion/
            /earn/naos/cola/aprobar/*/*.json
            /earn/naos/cola/aprobar/_tandas/
      - name: Despachar lo de NAOS y DD que sale en la media hora
        working-directory: earn/naos/motor/aprobar
        run: python3 programador.py --despachar --a-la-hora --antes 13 --tope-espera 13  # sin --marca: NAOS y DD
