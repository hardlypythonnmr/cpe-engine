# One-off dispatch written by publicar.py on N's word (via Lauren). It fires once, dispatches publicar.yml and disables itself.
# Lauren removes this file after it fired: python3 earn/naos/motor/publicar.py --quitar-cron deviance-g4a
name: publicar una vez deviance-g4a
on:
  schedule:
    - cron: "5 16 26 11 *"
permissions:
  actions: write
  contents: read
jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Only in 2026
        id: hoy
        run: |
          if [ "$(date -u +%Y-%m-%d)" = "2026-11-26" ]; then echo "si=true" >> "$GITHUB_OUTPUT"; else echo "si=false" >> "$GITHUB_OUTPUT"; fi
      - name: Dispatch publicar.yml
        if: steps.hoy.outputs.si == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml -R "$GITHUB_REPOSITORY" -f slug=deviance-g4a -f canal=naos -f donde=instagram -f cuando=2026-11-26T16:05:00Z -f modo=publicar -f seco=false
      - name: Disable this one-off workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable publicar-una-vez-deviance-g4a.yml -R "$GITHUB_REPOSITORY"
