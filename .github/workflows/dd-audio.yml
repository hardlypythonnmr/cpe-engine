# dd-audio: solo lee. Piloto de audio en tendencia de DD (N 19-nov: «Piloto medido (Rec.)»), paso 1.
# Consulta la Instagram Audio API (GET /ig_audio, changelog de Meta del 1-jun-2026) con el token de DD (Facebook Login):
# lo que está en tendencia (sin búsqueda) y una búsqueda, para música y para sonido original. Imprime cuántos devuelve y
# los campos de los primeros. No adjunta, no publica, no escribe nada ni hace commit.
name: dd-audio
on:
  workflow_dispatch:
    inputs:
      buscar:
        description: "texto de búsqueda para la segunda consulta"
        required: false
        default: "money"
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /earn/naos/motor/aprobar/registro.py
            /earn/naos/motor/instagram/
            /earn/naos/motor/nombres_dd.py
      - name: Herramientas del filtro (ffmpeg, numpy, onnxruntime, YAMNet)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          python3 -m pip install -q --user --break-system-packages numpy onnxruntime 2>/dev/null || python3 -m pip install -q --user numpy onnxruntime
          curl -sSfL -o "$RUNNER_TEMP/yamnet.onnx" https://huggingface.co/zeropointnine/yamnet-onnx/resolve/ac2ca3bd45d12ec1f19f1144205ea529b4e9dedf/yamnet.onnx
          echo "1510041dce24a2e9e84ec546807ac408ae496da6d1ed41bc3ccba649623f8e19  $RUNNER_TEMP/yamnet.onnx" | sha256sum -c -
          echo "RITMO_YAMNET=$RUNNER_TEMP/yamnet.onnx" >> "$GITHUB_ENV"
      - name: Audio de la Audio API (solo lectura)
        env:
          MERCURY_INSTAGRAM_TOKEN: ${{ (secrets.DD_INSTAGRAM_TOKEN || secrets.MERCURY_INSTAGRAM_TOKEN) }}
          MERCURY_INSTAGRAM_USER_ID: ${{ (vars.DD_INSTAGRAM_USER_ID || vars.MERCURY_INSTAGRAM_USER_ID) }}
          BUSCAR: ${{ inputs.buscar }}
        working-directory: earn/naos/motor/instagram
        run: |
          python3 - <<'PY'
          import json, os, ig
          ig.usar_marca("mercury")
          uid = os.environ["MERCURY_INSTAGRAM_USER_ID"]
          for tipo in ("music", "original_sound"):
              for q in ("", os.environ.get("BUSCAR") or ""):
                  params = {"audio_type": tipo, "user_id": uid}
                  if q:
                      params["search_query"] = q
                  try:
                      d = ig.llamar_crudo("GET", "ig_audio", params, anotar=False, crudo=True)
                  except ig.ErrorMeta as e:
                      print(f"== {tipo} q={q!r}: ERROR {e.linea()}")
                      continue
                  datos = (d.get("audio") or d.get("data") or []) if isinstance(d, dict) else []
                  datos = datos.get("data", []) if isinstance(datos, dict) else datos
                  print(f"== {tipo} q={q!r}: {len(datos)} resultados; claves de la respuesta: {sorted(d) if isinstance(d, dict) else type(d).__name__}")
                  for a in datos[:5]:
                      print("  " + json.dumps(a, ensure_ascii=False)[:400])
          print("== elegir_audio en seco (filtro: sin voz, golpe marcado, tempo alto):")
          for tema, dur in ((os.environ.get("BUSCAR") or "money", 30), ("", 20)):
              print(f"  tema={tema!r} dur={dur}s -> {json.dumps(ig.elegir_audio(tema, dur), ensure_ascii=False)}")
          import ritmo_audio
          print("== explorar: tendencia (4 páginas) y búsquedas de golpe, medidos y ordenados por puntaje")
          vistos, filas = set(), []
          for q in ("", "beat", "phonk", "funk"):
              for a in ig.candidatos_audio(q, paginas=4):
                  if str(a["audio_id"]) in vistos or (q and a["busqueda"] == "tendencia"):
                      continue
                  vistos.add(str(a["audio_id"]))
                  url = ig.url_audio(a)
                  m = ritmo_audio.medir(url) if url else None
                  filas.append((ritmo_audio.puntaje(m), {"audio_id": str(a["audio_id"]), "title": a.get("title"),
                               "ig_username": a.get("ig_username"), "busqueda": a["busqueda"], "dur_ms": a.get("duration_in_ms"),
                               "ritmo": m, "enlace": a.get("on_platform_audio_preview_link"), "download_url": url}))
                  if len(filas) >= 70:
                      break
          for p, f in sorted(filas, key=lambda x: -x[0]):
              print("EXPLORAR " + json.dumps(dict(f, puntaje=round(p, 3)), ensure_ascii=False))
          PY
